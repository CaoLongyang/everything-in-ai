<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ai-chat-sync</title>
<style>
  :root { --ink: #1f2328; --muted: #6b7280; --line: #e5e7eb; --bad: #c0392b; --ok: #1a7f37; }
  body { font: 13px/1.5 system-ui, "Microsoft YaHei", sans-serif; color: var(--ink); width: 320px; margin: 0; padding: 14px 16px; }
  h1 { font-size: 15px; margin: 0 0 2px; }
  p.lead { color: var(--muted); margin: 0 0 12px; }
  .site { border-top: 1px solid var(--line); padding: 8px 0; }
  .site header { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .site .state { color: var(--muted); font-weight: 400; }
  .site .error { color: var(--bad); }
  .site .good { color: var(--ok); }
  button { font: inherit; padding: 5px 12px; border-radius: 6px; border: 1px solid #1f2328; background: #1f2328; color: #fff; cursor: pointer; }
  button.plain { background: #fff; color: var(--ink); border-color: var(--line); }
  .row { display: flex; gap: 8px; margin: 10px 0; }
  details { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 4px; }
  label { display: block; margin: 6px 0; }
  input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 4px 6px; font: inherit; border: 1px solid var(--line); border-radius: 4px; }
  .hint { color: var(--muted); font-size: 12px; }
  .sub { margin-left: 22px; }
  .sub[hidden] { display: none; }
</style>
</head>
<body>
  <h1 data-t="title"></h1>
  <p class="lead" data-t="lead"></p>
  <div id="sites"></div>
  <div class="row">
    <button id="now" data-t="syncNow"></button>
    <button id="pause" class="plain"></button>
  </div>
  <details id="setup">
    <summary data-t="settings"></summary>
    <p><b data-t="whereTo"></b></p>
    <label><input type="radio" name="mode" value="files"> <span data-t="modeFiles"></span></label>
    <div id="files-box" class="sub">
      <label><input id="fmt-md" type="checkbox"> <span data-t="fmtMd"></span></label>
      <label><input id="fmt-json" type="checkbox"> <span data-t="fmtJson"></span></label>
    </div>
    <label><input type="radio" name="mode" value="eia"> <span data-t="modeEia"></span></label>
    <div id="eia-box" class="sub">
      <label><span data-t="port"></span> <input id="port" type="number" min="1" max="65535"></label>
      <label><span data-t="token"></span> <input id="token" type="text" autocomplete="off" spellcheck="false"></label>
      <p class="hint" data-t="eiaHint"></p>
    </div>
    <p><b data-t="which"></b></p>
    <label><input id="site-chatgpt" type="checkbox"> ChatGPT</label>
    <label><input id="site-claude" type="checkbox"> Claude</label>
    <label><input id="site-gemini" type="checkbox"> Gemini<span class="hint" data-t="geminiHint"></span></label>
    <p><b data-t="language"></b></p>
    <label><select id="lang"><option value="auto" data-t="langAuto"></option><option value="zh">中文</option><option value="en">English</option></select></label>
    <button id="save" class="plain" data-t="save"></button> <span id="saved" class="hint"></span>
  </details>
  <script src="popup.js" type="module"></script>
</body>
</html>
