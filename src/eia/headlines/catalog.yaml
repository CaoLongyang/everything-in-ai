      - {type: hotlist, platform: zhihu}
      - {type: hotlist, platform: weibo}
      - {type: hotlist, platform: bilibili}
      - {type: hotlist, platform: douyin}
      - {type: hotlist, platform: toutiao}
  - name: 科技
    sources:
      - {type: hackernews, min_score: 100}
      - {publisher: The Verge, url: https://www.theverge.com/rss/index.xml}
      - {publisher: Ars Technica, url: https://feeds.arstechnica.com/arstechnica/index}
      - {publisher: TechCrunch, url: https://techcrunch.com/feed/}
      - {publisher: IT之家, url: https://www.ithome.com/rss/}
