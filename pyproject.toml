[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everything-in-ai"
version = "0.0.1"
description = "把你的 AI 对话和信息流沉淀成一个纯 Markdown 的个人知识库"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
# AI 功能才需要。版本写死，升级要有意识地改这里（docs/specs/llm-adapter.delta-v1.md 第 1 节）
llm = ["anthropic==2.6.0", "openai==3.46.0"]
# 新闻雷达才需要（docs/specs/headline-radar.md 第 8 节）
news = ["feedparser==6.0.14", "numpy==2.4.4"]  # numpy 2.5 起不支持 Python 3.11
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "everything-in-ai[llm,news]",
]

[project.scripts]
eia = "eia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["live: 会真的调用 AI 服务、花钱，只在手动时用 pytest -m live 运行"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# feedparser 没有类型信息；只对它放开，用法集中在 eia/headlines/feeds.py（2026-11-21）
[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true

[tool.coverage.run]
# 覆盖率数据放进 reports/，根目录少一个文件
data_file = "reports/.coverage"
